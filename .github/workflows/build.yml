name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd, dragonfly, openbsd, netbsd, illumos, solaris]
        goarch: [amd64, arm64, arm]
        exclude:
          - goos: dragonfly
            goarch: arm64
          - goos: illumos
            goarch: arm64
          - goos: solaris
            goarch: arm64
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: arm
          - goos: freebsd
            goarch: arm
          - goos: dragonfly
            goarch: arm
          - goos: openbsd
            goarch: arm
          - goos: netbsd
            goarch: arm
          - goos: illumos
            goarch: arm
          - goos: solaris
            goarch: arm
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Check formatting
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' locally and commit the changes."
          exit 1
        fi

    - name: Check language file formatting
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: go run ./tools/langfmt -check cmd/f4/lang/*.lng

    - name: Verify generated application icons
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        go generate ./cmd/f4
        git diff --exit-code -- \
          cmd/f4/assets/icon/generated \
          cmd/f4/rsrc_windows_amd64.syso \
          cmd/f4/rsrc_windows_arm64.syso

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Prepare flags for truly static binary on Linux
        LDFLAGS="-s -w"
        if [ "$GOOS" = "linux" ]; then LDFLAGS="$LDFLAGS -extldflags '-static'"; fi

        # Go embeds the commit in release artifacts, but not the tag. Keep
        # prerelease tags such as v0.2.0-beta available to the updater.
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X main.buildVersion=$GITHUB_REF_NAME"
        fi

        GCFLAGS=""
        if [ "$GOOS" = "freebsd" ]; then
          GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
        fi

        # Build core
        go build -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS" -o build/f4$EXT ./cmd/f4

        # Build GUI-only binary for Windows (no console flash)
        if [ "$GOOS" = "windows" ]; then
          go build -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS -H windowsgui" -o build/f4-gui$EXT ./cmd/f4
        fi

        # Copy language and help assets
        cp -r cmd/f4/lang cmd/f4/help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        # Add freedesktop launch metadata and the application icon to Linux archives.
        if [ "$GOOS" = "linux" ]; then
          mkdir -p build/share/applications
          cp packaging/linux/f4.desktop build/share/applications/
          for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
            icon_dir="build/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "cmd/f4/assets/icon/generated/f4-${size}.png" \
              "$icon_dir/io.github.unxed.f4.png"
          done
          mkdir -p build/share/icons/hicolor/scalable/apps
          cp cmd/f4/assets/icon/f4.svg \
            build/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg
        fi

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

        if [ "${{ matrix.goos }}" = "darwin" ]; then
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APP="F4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/f4 "$APP/Contents/MacOS/f4"
          chmod +x "$APP/Contents/MacOS/f4"
          cp cmd/f4/assets/icon/generated/f4.icns "$APP/Contents/Resources/f4.icns"
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__BUILD_VERSION__/$GITHUB_RUN_NUMBER/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "f4-${{ matrix.goos }}-${{ matrix.goarch }}.app.zip" "$APP"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  # Эта джоба собирает Windows-бинарник тулчейном thongtech/go-legacy-win7,
  # чтобы f4 можно было запускать на Windows 7/8/8.1 (см. issue #514).
  #
  # Тулчейн go-legacy-win7-1.26.3-1 в остальном полноценен, но в его
  # sync/atomic отсутствуют методы Or/And у типизированных атомиков
  # (добавлены в Go 1.23, см. https://go.dev/issue/61395) — это баг
  # именно сборки тулчейна, а не самого Go 1.26.3
  # (см. https://github.com/thongtech/go-legacy-win7/issues/13, ещё не
  # исправлено апстримом). Без них не собираются github.com/gogpu/gg и
  # github.com/ncruces/go-sqlite3. Вместо патчинга каждой такой
  # зависимости по отдельности (как это было проверено вручную в
  # issue #514) добавляем недостающие методы один раз прямо в GOROOT
  # скачанного тулчейна — это эквивалентно апстримному фиксу и не требует
  # правок go.mod. Если thongtech поправят это в своей сборке, наш файл
  # с большой вероятностью начнёт конфликтовать (duplicate method) —
  # тогда этот шаг нужно будет просто удалить.
  build-win7:
    name: Build (windows7/amd64, legacy toolchain)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Download go-legacy-win7 toolchain
      run: |
        set -euo pipefail
        curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
          -o go-legacy-win7.tar.gz \
          https://github.com/thongtech/go-legacy-win7/releases/download/v1.26.3-1/go-legacy-win7-1.26.3-1.linux_amd64.tar.gz
        echo "8a1acb588fa3ab7827ce7b1be5795b356be65a500c70af297ad94ab2b3370ea6  go-legacy-win7.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/go-legacy-win7"
        tar -xzf go-legacy-win7.tar.gz -C "$HOME/go-legacy-win7"
        echo "GOROOT=$HOME/go-legacy-win7/go-legacy-win7" >> "$GITHUB_ENV"
        echo "$HOME/go-legacy-win7/go-legacy-win7/bin" >> "$GITHUB_PATH"

    - name: Restore missing sync/atomic Or/And methods (thongtech/go-legacy-win7#13)
      run: |
        cat > "$GOROOT/src/sync/atomic/or_and_win7compat.go" <<'EOF'
        // This file restores the Or/And methods on typed atomics (added
        // upstream in Go 1.23, see https://go.dev/issue/61395) that are
        // missing from the go-legacy-win7-1.26.3-1 toolchain despite it
        // being based on Go 1.26.3. See
        // https://github.com/thongtech/go-legacy-win7/issues/13.
        // Remove this file once that's fixed upstream.
        package atomic

        func (x *Int32) Or(mask int32) (old int32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Int32) And(mask int32) (old int32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Int64) Or(mask int64) (old int64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Int64) And(mask int64) (old int64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uint32) Or(mask uint32) (old uint32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uint32) And(mask uint32) (old uint32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uint64) Or(mask uint64) (old uint64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uint64) And(mask uint64) (old uint64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uintptr) Or(mask uintptr) (old uintptr) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uintptr) And(mask uintptr) (old uintptr) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }
        EOF

    - name: Build binaries
      run: |
        mkdir -p build/plugins/dummy_internal
        LDFLAGS="-s -w"
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X main.buildVersion=$GITHUB_REF_NAME"
        fi

        go build -trimpath -ldflags="$APP_LDFLAGS" -o build/f4.exe ./cmd/f4
        # GUI-only binary (no console flash), same as in the main matrix.
        go build -trimpath -ldflags="$APP_LDFLAGS -H windowsgui" -o build/f4-gui.exe ./cmd/f4

        cp -r cmd/f4/lang cmd/f4/help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        cd plugins/dummy_internal
        go build -trimpath -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin.exe .

    - name: Package
      run: (cd build && zip -r ../f4-windows7-amd64.zip .)

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: f4-windows7-amd64
        path: f4-windows7-amd64.zip
        retention-days: 7

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One hosted runner per native os/arch cell, labeled to match the
        # build matrix.
        include:
          - { os: ubuntu-latest,    target: linux/amd64, cover: linux }
          - { os: ubuntu-24.04-arm, target: linux/arm64 }
          - { os: macos-latest,     target: darwin/arm64, cover: macos }
          - { os: macos-15-intel,   target: darwin/amd64 }
          - { os: windows-latest,   target: windows/amd64, cover: windows }
          - { os: windows-11-arm,   target: windows/arm64 }
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run Tests
      shell: bash
      env:
        # Coverage comes from one cell per OS: which files compile is gated by
        # GOOS, so the arm64 twins would report the same lines twice. -coverpkg
        # counts hits across package boundaries, without which a project that
        # keeps most of its tests in cmd/f4 reports every other package as
        # nearly untested.
        COVER: ${{ matrix.cover && '-coverpkg=./... -coverprofile=cover.out' || '' }}
      run: |
        go test $COVER -timeout 15m -skip '^TestAllDialogs_LayoutValidation$' ./...
        # Layout validation mutates shared UI registries from parallel
        # subtests. Go 1.26 schedules them aggressively enough to expose the
        # upstream race, so isolate that test in a single-threaded process.
        GOMAXPROCS=1 go test -timeout 15m -run '^TestAllDialogs_LayoutValidation$' ./cmd/f4

    - name: Upload coverage to Codecov
      if: matrix.cover
      uses: codecov/codecov-action@v7
      with:
        files: cover.out
        # Without this the uploader also sweeps the tree for anything that
        # looks like a report and picks up cmd/f4/lang/coverage_baseline.txt,
        # which counts translation keys, not statements.
        disable_search: true
        flags: ${{ matrix.cover }}
        token: ${{ secrets.CODECOV_TOKEN }}
        # Coverage is a report, not a gate: a failed upload (or a repository
        # with no token yet) must not turn the test run red.
        fail_ci_if_error: false

    - name: Dump crash reports on failure
      if: failure()
      shell: bash
      run: |
        # A crash handler that os.Exit()s bypasses both go test's output and
        # TestMain's temp-dir cleanup, so the reports it wrote survive here.
        for base in "${TMPDIR:-/tmp}" "$(cygpath -u "${TEMP:-}" 2>/dev/null)"; do
          [ -n "$base" ] && [ -d "$base" ] || continue
          find "$base" -maxdepth 4 -path '*f4-test-config*' -name '*.log' 2>/dev/null | head -20 | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done
        done

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The race detector requires cgo and the Ubuntu runner provides the
      # native compiler needed by the instrumented test binary.
      CGO_ENABLED: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run race detector
      shell: bash
      run: |
        # cmd/f4 tests replace vtui's process-global FrameManager while its
        # background task pump is alive, so they need a dedicated race-safe
        # harness before they can run under -race. luaplug's tests call raw
        # FFI pointers, which Go's checkptr rejects under -race. Keep both
        # packages in the instrumented compile below and run all other
        # package tests under the detector.
        packages=$(go list ./... | grep -Ev '^github.com/unxed/f4/(cmd/f4|luaplug)$')
        go test -race -timeout 15m $packages
        go test -race -run '^$' ./cmd/f4 ./luaplug

  release:
    name: Create Official Release
    needs: [build, build-win7, test, race]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет Homebrew tap при пуше тэгов v*.*.*,
  # чтобы под macOS можно было поставить f4 одной командой:
  #   brew install <owner>/tap/f4
  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Compute version and download macOS artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        for arch in amd64 arm64; do
          file="f4-darwin-${arch}.tar.gz"
          echo "Downloading $file ..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" "$BASE/$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "SHA_${arch}=$sha" >> "$GITHUB_ENV"
          echo "URL_${arch}=$BASE/$file" >> "$GITHUB_ENV"
        done

    - name: Generate formula
      run: |
        mkdir -p tap/Formula
        cat > tap/Formula/f4.rb <<EOF
        # This file is generated automatically by CI on each tagged release.
        # Do not edit by hand — changes will be overwritten.
        class F4 < Formula
          desc "# f4 — efficient and cozy file manager in go"
          homepage "https://github.com/${GITHUB_REPOSITORY}"
          version "${VERSION}"
          license "BSD-3-Clause"

          on_macos do
            on_arm do
              url "${URL_arm64}"
              sha256 "${SHA_arm64}"
            end
            on_intel do
              url "${URL_amd64}"
              sha256 "${SHA_amd64}"
            end
          end

          def install
            bin.install "f4"
            prefix.install "plugins" if File.directory?("plugins")
          end

          test do
            assert_match "f4", shell_output("#{bin}/f4 --version 2>&1")
          end
        end
        EOF
        echo "----- Generated Formula -----"
        cat tap/Formula/f4.rb

    - name: Push formula to tap repository
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
          echo "Create a PAT with 'contents:write' on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap and add it as HOMEBREW_TAP_TOKEN."
          exit 0
        fi
        TAP_REPO="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
        mkdir -p tap-repo/Formula
        cp tap/Formula/f4.rb tap-repo/Formula/f4.rb
        cd tap-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/f4.rb; then
          echo "Formula already up to date; nothing to commit."
          exit 0
        fi
        git add Formula/f4.rb
        git commit -m "f4 ${VERSION}"
        git push

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: [build, build-win7, test, race]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code (to get git info)
      uses: actions/checkout@v7

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*
